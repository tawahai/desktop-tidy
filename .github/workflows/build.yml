name: Build Windows exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall -q .

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Generate icon and build exe
        run: |
          python dt_icon.py
          python -m PyInstaller --noconfirm --onefile --windowed --name "桌面收纳盒" --icon app.ico main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-tidy-exe
          path: dist/*.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --generate-notes }
          gh release upload $env:GITHUB_REF_NAME "dist/桌面收纳盒.exe" --clobber
