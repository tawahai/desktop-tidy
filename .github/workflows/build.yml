name: Build Windows exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall -q .

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Generate icon and build exe
        run: |
          python dt_icon.py
          python -m PyInstaller --noconfirm --onefile --windowed --name DesktopTidy --icon app.ico main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: DesktopTidy-windows
          path: dist/DesktopTidy.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --generate-notes }
          gh release upload $env:GITHUB_REF_NAME "dist/DesktopTidy.exe" --clobber

      - name: Attach a zip containing the Chinese-named exe
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub 的发布接口会把非 ASCII 的附件名替换成 default.exe，
          # 所以中文名版本打包成 zip（zip 内部文件名仍是 桌面收纳盒.exe）
          New-Item -ItemType Directory -Path pkg -Force | Out-Null
          Copy-Item dist/DesktopTidy.exe "pkg/桌面收纳盒.exe" -Force
          Compress-Archive -Path "pkg/桌面收纳盒.exe" -DestinationPath "dist/DesktopTidy-CN.zip" -Force
          gh release upload $env:GITHUB_REF_NAME "dist/DesktopTidy-CN.zip" --clobber
