name: 功能建议 / Feature request
description: 想要的新功能或改进 / Suggest an idea
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题 / What problem are you trying to solve
      placeholder: 例如：想把分区贴到屏幕左侧，而不是上边
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望的方案 / What you would like to happen

  - type: textarea
    id: alternatives
    attributes:
      label: 试过的替代方案 / Alternatives you have tried

  - type: input
    id: system
    attributes:
      label: 系统与屏幕 / OS and screen
      placeholder: Windows 10 22H2 / 1920x1080 / 100%

